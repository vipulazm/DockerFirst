services:
  app:
    build: .
    image: docker-first:2.0
    container_name: docker-first-app
    ports:
      - "8080:8080"
    environment:
        SERVER_PORT:  8080
        POSTGRES_HOST: postgres
        POSTGRES_DB: postgres
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
    names-volume:
      name: first-vol-text
    postgres-data:
      name: postgres-data-vol
