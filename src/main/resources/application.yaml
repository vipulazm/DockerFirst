spring:
  application:
    name: DockerFirst

  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
    port: ${SERVER_PORT:8080}

app:
  file:
    path: ./names.txt

springdoc:
  swagger-ui:
     path: /swagger